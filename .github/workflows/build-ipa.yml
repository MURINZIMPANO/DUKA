name: Build iOS Simulator IPA

on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build-ios-ipa:
    name: Build iOS Simulator IPA
    runs-on: macos-14   # Apple Silicon Mac — required for iOS builds

    env:
      JAVA_HOME: ''  # will be set by setup-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle    # use setup-java's built-in Gradle caching

      #彻底清除所有旧的 org.gradle.java.home 值
      - name: Clean all Java home settings
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "java -version:"
          java -version
          # Remove from project gradle.properties if present
          if [ -f gradle.properties ]; then
            grep -v 'org\.gradle\.java\.home' gradle.properties > gradle.properties.tmp || true
            mv gradle.properties.tmp gradle.properties
          fi
          # Remove user-level gradle.properties (may have stale sdkman path from cache)
          rm -f ~/.gradle/gradle.properties
          # Remove any global gradle.properties
          rm -f /etc/gradle/gradle.properties 2>/dev/null || true
          echo "--- gradle.properties after cleanup ---"
          cat gradle.properties
          echo "--- done ---"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build shared XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework --no-daemon

      - name: Select Xcode
        run: |
          # Pick the latest available Xcode on the runner
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project iosApp/DukaApp.xcodeproj \
            -scheme DukaApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios-simulator -name "DukaApp.app" -type d | head -1)
          echo "Packaging: $APP_PATH"
          mkdir -p build/ipa-package/Payload
          cp -r "$APP_PATH" build/ipa-package/Payload/DukaApp.app
          cd build/ipa-package
          zip -r ../DukaApp-simulator.ipa Payload/
          cd ../..
          ls -lh build/DukaApp-simulator.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duka-iOS-Simulator-IPA
          path: build/DukaApp-simulator.ipa
          retention-days: 30

      # Also rebuild Android APK in same run so both are always in sync
      - name: Build Android APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duka-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
