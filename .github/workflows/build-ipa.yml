name: Build iOS Simulator IPA

on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build-ios-ipa:
    name: Build iOS Simulator IPA
    runs-on: macos-14   # Apple Silicon Mac — required for iOS builds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Fix Java home in gradle.properties
        run: |
          # Remove any hardcoded org.gradle.java.home from project gradle.properties
          # so CI uses the JAVA_HOME from setup-java instead
          sed -i '' '/org\.gradle\.java\.home/d' gradle.properties 2>/dev/null || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Java home in gradle.properties removed"

      - name: Build shared XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework -Dorg.gradle.java.home=$JAVA_HOME

      - name: Select Xcode
        run: |
          # Pick the latest available Xcode on the runner
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project iosApp/DukaApp.xcodeproj \
            -scheme DukaApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios-simulator -name "DukaApp.app" -type d | head -1)
          echo "Packaging: $APP_PATH"
          mkdir -p build/ipa-package/Payload
          cp -r "$APP_PATH" build/ipa-package/Payload/DukaApp.app
          cd build/ipa-package
          zip -r ../DukaApp-simulator.ipa Payload/
          cd ../..
          ls -lh build/DukaApp-simulator.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duka-iOS-Simulator-IPA
          path: build/DukaApp-simulator.ipa
          retention-days: 30

      # Also rebuild Android APK in same run so both are always in sync
      - name: Build Android APK
        run: ./gradlew :app:assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duka-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
