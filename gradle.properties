# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Kotlin Multiplatform
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

# Use JDK 21 for Gradle daemon
# Set this to your local JDK 17+ path, e.g. on Windows:
# org.gradle.java.home=C\:/Program Files/Eclipse Adoptium/jdk-17.0.10.7-hotspot
# (Leave unset and Android Studio / JAVA_HOME will supply the JDK automatically.)
